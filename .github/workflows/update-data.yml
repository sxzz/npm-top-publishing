name: Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Setup JS
        uses: sxzz/workflows/setup-js@main
        with:
          persist-credentials: true

      - name: Refresh
        run: pnpm run refresh

      - name: Commit
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: 'chore: update data [ci skip]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
